<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PULSE — Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app-shell">

    <!-- HEADER -->
    <header class="hero">

      <img
        src="pulse-logo.png"
        alt="PULSE Token"
        class="pulse-logo"
      >

      <h1>PULSE Dashboard</h1>

      <p class="tagline">
        Complete • Earn • Get Rewarded
      </p>

      <!-- DROPDOWN MENU -->
      <details class="menu">
        <summary>☰ Menu</summary>

        <div class="menu-panel">

          <a href="index.html">
            Home
          </a>

          <a href="how-it-works.html">
            How It Works
          </a>

          <a href="about.html">
            About PULSE
          </a>

          <a href="contact.html">
            Contact
          </a>

          <a href="dashboard.html">
            Dashboard
          </a>

          <a
            id="admin-dashboard-link"
            href="admin.html"
            style="display:none;"
          >
            ⚙ Admin Dashboard
          </a>

        </div>
      </details>

    </header>


    <!-- USER DASHBOARD -->
    <section id="userDashboard" class="panel">

      <h2>Your PULSE Dashboard</h2>

      <div id="authStatus">
        Loading account...
      </div>

      <div id="dashboardContent">
        Loading dashboard...
      </div>

    </section>

  </main>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CONFIG -->
  <script src="config.js"></script>

  <!-- APP -->
  <script src="app.js"></script>


  <!-- ADMIN LINK CHECK -->
  <script>

    const dashboardSupabase =
      window.supabase.createClient(
        "https://egeftdnvgcqjjavrpohd.supabase.co",
        "sb_publishable_bhnKTWbI3aS0yFABUMWaOg_nkEBlTgv"
      );

    async function checkDashboardAdmin() {

      const adminLink =
        document.getElementById("admin-dashboard-link");

      if (!adminLink) return;

      try {

        const {
          data: {
            user
          }
        } = await dashboardSupabase.auth.getUser();

        if (!user) {
          adminLink.style.display = "none";
          return;
        }

        const {
          data: profile,
          error
        } = await dashboardSupabase
          .from("profiles")
          .select("role")
          .eq("id", user.id)
          .maybeSingle();

        if (error) {
          console.error(
            "Admin check failed:",
            error
          );

          adminLink.style.display = "none";
          return;
        }

        if (
          profile &&
          profile.role === "admin"
        ) {
          adminLink.style.display = "block";
        } else {
          adminLink.style.display = "none";
        }

      } catch (error) {

        console.error(
          "Admin access check failed:",
          error
        );

        adminLink.style.display = "none";
      }
    }

    checkDashboardAdmin();

  </script>

</body>
</html>
